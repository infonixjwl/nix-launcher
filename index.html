<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nix Jewels</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#eef2f6;--tile:#fff;--ink:#0f1b2d;--mute:#5d6b80;--line:#d5dde7;--ice:#2b6cb0;--head:#0f1b2d;--headink:#eaf2fa}
@media(prefers-color-scheme:dark){:root{--bg:#0b1422;--tile:#16243a;--ink:#eaf2fa;--mute:#93a3b8;--line:#243752;--ice:#9cc7ee;--head:#0b1422}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:var(--head);color:var(--headink);padding:calc(env(safe-area-inset-top,0px) + 32px) 22px 30px}
header h1{font:400 2.1rem/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px;letter-spacing:.01em}
header p{margin:0;color:#9db2c9;font-size:.95rem}
main{max-width:560px;margin:0 auto;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 28px)}
h2{font:600 .9rem/1 system-ui,sans-serif;color:var(--mute);margin:22px 4px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:132px;padding:16px;border-radius:22px;background:var(--tile);border:1px solid var(--line);color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--bg)}
.tx b{display:block;font-size:1.05rem;font-weight:600}
.tx small{display:block;color:var(--mute);font-size:.82rem;margin-top:2px}
.off{opacity:.55}
#hint{margin:26px 4px 0;color:var(--mute);font-size:.85rem;display:none}
</style>
</head>
<body>
<header><h1>Nix Jewels</h1><p>Open a form or dashboard</p></header>
<main><div id="list"></div><p id="hint">Install: on iPhone tap Share, then Add to Home Screen. On Android tap the browser menu, then Install app.</p></main>
<script>
/* ===== EDIT HERE: one line per form or dashboard =====
   group: the heading it sits under (use any name, e.g. 'Dashboards')
   icon: any emoji | title | desc: short line | url: the full link */
const ITEMS = [
  { group:'Forms', icon:'💎', title:'Piece',            desc:'Add or update a piece',        url:'https://docs.google.com/forms/d/e/1FAIpQLSdh0zXuIUej02hDR00Xb97NI4DQHmo_gaepcWqFbXS54pq-0w/viewform?usp=header' },
  { group:'Forms', icon:'🔹', title:'Diamond',          desc:'Add or update diamonds',       url:'https://docs.google.com/forms/d/e/1FAIpQLSfL_X2Orxu4IcivKMPYUUCDPS7Cp4PiDmBKF76WYJ0R4H_dKw/viewform?usp=header' },
  { group:'Forms', icon:'✏️', title:'Fix SKU',          desc:'Correct a wrong SKU',          url:'https://docs.google.com/forms/d/e/1FAIpQLSfXztrc6Lq_yjB0uog5mOxUt_XjNsouk5i2FHEX4oal2INAyw/viewform?usp=header' },
  { group:'Forms', icon:'🔓', title:'Inventory access', desc:'Urgent manual edit',           url:'https://docs.google.com/forms/d/e/1FAIpQLSd-Cl8hK4d9TDtvRJP8FJjlY-KtOSbiGGYmoeD3hWi4hbR5VA/viewform?usp=header' },
  // { group:'Dashboards', icon:'📊', title:'Dashboard', desc:'Sales and stock', url:'https://...' },
];
/* ===== end of the part you edit ===== */

const root = document.getElementById('list');
[...new Set(ITEMS.map(i => i.group))].forEach(g => {
  const h = document.createElement('h2'); h.textContent = g; root.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid'; root.appendChild(grid);
  ITEMS.filter(i => i.group === g).forEach(i => {
    const ready = /^https?:\/\//.test(i.url);
    const t = document.createElement(ready ? 'a' : 'div');
    t.className = 'tile' + (ready ? '' : ' off');
    if (ready) { t.href = i.url; t.target = '_blank'; t.rel = 'noopener'; }
    t.innerHTML = '<span class="ic"></span><span class="tx"><b></b><small></small></span>';
    t.querySelector('.ic').textContent = i.icon;
    t.querySelector('b').textContent = i.title;
    t.querySelector('small').textContent = ready ? i.desc : 'Link not set yet';
    grid.appendChild(t);
  });
});
if (!(matchMedia('(display-mode: standalone)').matches || navigator.standalone)) {
  document.getElementById('hint').style.display = 'block';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
